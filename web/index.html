<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Video</title>
<script>
  // 首屏同步预设主题：主题存在 SQLite，JS 要等 IPC 才能读到；
  // 若等异步结果再切，暗色用户会先看到白表头。CSS 加载前先把 data-theme 定下来。
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t !== 'dark' && t !== 'light') t = 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span></span></div>
      <div class="brand-text"><h1>Magic Video</h1><p>本地视频管理</p></div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="home"><span class="nav-icon ni-home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span>总览</button>
      <button class="nav-item" data-view="continue"><span class="nav-icon ni-play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.3 16.2 12 10 15.7z"/></svg></span>继续观看</button>
      <button class="nav-item" data-view="history"><span class="nav-icon ni-clock"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.6 2.1"/></svg></span>历史记录</button>
      <button class="nav-item" data-view="library"><span class="nav-icon ni-grid"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg></span>媒体库</button>
      <button class="nav-item" data-view="stats"><span class="nav-icon ni-stats"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg></span>观影报告</button>
      <button class="nav-item" data-view="posters"><span class="nav-icon ni-poster"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="8.5" r="1.4"/></svg></span>剧集墙</button>
      <button class="nav-item" data-view="quicksearch"><span class="nav-icon ni-search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span>全盘快搜</button>
      <button class="nav-item" data-view="websearch"><span class="nav-icon ni-web"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.2 9.5h17.6M3.2 14.5h17.6"/><path d="M12 3c-2.6 2.4-2.6 15.6 0 18M12 3c2.6 2.4 2.6 15.6 0 18"/></svg></span>网页搜索</button>
      <button class="nav-item" data-view="watched"><span class="nav-icon ni-check"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m7.8 12.4 2.9 2.9 5.5-6"/></svg></span>看过的列表</button>
      <button class="nav-item" data-view="watchlist"><span class="nav-icon ni-track"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h10"/><path d="M17.5 15v6M14.5 18h6"/></svg></span>追剧列表</button>
      <button class="nav-item" data-view="import"><span class="nav-icon ni-import"><svg viewBox="0 0 24 24"><path d="M12 3v11"/><path d="m8 10.5 4 4 4-4"/><path d="M4 17v3h16v-3"/></svg></span>导入列表</button>
      <button class="nav-item" data-view="scan"><span class="nav-icon ni-folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>扫描目录</button>
      <button class="nav-item" data-view="processes"><span class="nav-icon ni-process"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.6"/><rect x="3" y="14" width="18" height="6" rx="1.6"/><path d="M7 7h.01M7 17h.01"/><path d="M11 7h6M11 17h6"/></svg></span>后台进程</button>
      <button class="nav-item" data-view="settings"><span class="nav-icon ni-gear"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.3M12 19.2v2.3M4.5 4.5l1.6 1.6M17.9 17.9l1.6 1.6M2.5 12h2.3M19.2 12h2.3M4.5 19.5l1.6-1.6M17.9 6.1l1.6-1.6"/></svg></span>设置</button>
    </nav>
    <div class="sidebar-foot">
      <div class="daemon-state" title="后台记录默认随软件启动，可在「设置」里关闭"><span class="dot" id="daemonDot"></span><span id="daemonText">检测后台记录…</span></div>
      <div class="version" id="versionText">v0.1.0</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title"><h2 id="viewTitle">总览</h2><p id="viewSubtitle">你的播放进度一目了然</p></div>
      <div class="topbar-right">
        <!-- 常驻播放控制条：内嵌与独立窗口两种模式都能用。
             之前只在 #playerStage 里放控制条，独立窗口播放时用户完全看不到倍速/上下集。 -->
        <div class="player-bar" id="playerBar" hidden>
          <button class="pbtn" data-action="player-prev" title="上一集">⏮</button>
          <button class="pbtn" data-action="player-play-pause" title="播放 / 暂停">⏯</button>
          <button class="pbtn" data-action="player-stop" title="停止">■</button>
          <button class="pbtn" data-action="player-next" title="下一集">⏭</button>
          <select class="input pbar-speed" id="topPlayerSpeed" aria-label="播放倍速" title="播放倍速">
            <option value="1">1.0×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2.0×</option>
          </select>
          <button class="pbtn" data-action="player-fullscreen" title="全屏 / 还原">⛶</button>
        </div>
        <div class="player-chip" id="playerChip"><span class="dot gray"></span><span>正在检测播放器…</span></div>
        <button class="embed-btn" id="embedToggle" data-action="toggle-embed" title="切换「软件内播放 / 独立窗口播放」">
          <span class="embed-dot" id="embedDot"></span><span id="embedLabel">内嵌播放</span>
        </button>
        <button class="theme-btn" id="themeToggle" data-action="toggle-theme" title="切换黑 / 白主题">
          <span id="themeIcon">☾</span><span id="themeLabel">深色</span>
        </button>
      </div>
    </header>
    <div class="content" id="content"></div>
    <!-- 软件内播放舞台：PotPlayer 原生窗口会按 #playerHost 的屏幕矩形覆盖在这里 -->
    <div class="player-stage" id="playerStage" hidden>
      <div class="player-stage-bar">
        <div class="player-stage-title">
          <b id="playerStageTitle">正在播放</b>
          <span class="hint" id="playerStageHint">播放器已嵌入本窗口，进度照常自动记录</span>
        </div>
        <div class="btn-row">
          <button class="btn btn-sm" data-action="embed-resync">重排画面</button>
          <button class="btn btn-sm" data-action="embed-stop">退出内嵌播放</button>
        </div>
      </div>
      <div class="player-host" id="playerHost"><div class="player-holder">正在启动 PotPlayer…</div></div>
      <!-- 控制条独立于 #playerHost：它是 HTML 层，不会被 SetParent 进来的原生子窗口盖住。
           播放/停止居中，上一集/下一集与倍速在同组，全屏固定在右下角。 -->
      <div class="player-controls">
        <div class="player-controls-side"><span class="hint" id="playerEpisodeHint"></span></div>
        <div class="player-controls-center">
          <button class="btn btn-sm" data-action="player-prev" title="上一集">⏮ 上一集</button>
          <button class="btn btn-sm btn-primary player-play" id="playerPlayPause"
                  data-action="player-play-pause" title="播放 / 暂停">▶ 播放/暂停</button>
          <button class="btn btn-sm" data-action="player-stop" title="停止">■ 停止</button>
          <button class="btn btn-sm" data-action="player-next" title="下一集">下一集 ⏭</button>
          <select class="input player-speed" id="playerSpeed" aria-label="播放倍速">
            <option value="1">1.0×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2.0×</option>
          </select>
        </div>
        <div class="player-controls-side right">
          <button class="btn btn-sm" data-action="player-fullscreen" id="playerFullscreen"
                  title="全屏 / 还原（内嵌模式下为放大播放区）">⛶ 全屏</button>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<!-- 设置弹窗（IDEA 式）：左侧分类列表、右侧内容，整体浮层，不占用主视图；
     点侧栏「设置」打开，Esc / 取消 / 点遮罩关闭。 -->
<div class="modal-root" id="settingsModal" hidden>
  <div class="modal-backdrop" data-action="close-settings"></div>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-head">
      <h2 id="settingsTitle">设置</h2>
      <button class="modal-x" data-action="close-settings" title="关闭（Esc）" aria-label="关闭">✕</button>
    </div>
    <div class="settings-body">
      <nav class="settings-nav" id="settingsNav" aria-label="设置分类"></nav>
      <div class="settings-pane" id="settingsPane"></div>
    </div>
    <div class="settings-foot">
      <span class="hint">改动后点「保存设置」生效；Esc 或「取消」放弃未保存的改动。</span>
      <div class="btn-row">
        <button class="btn" data-action="close-settings">取消</button>
        <button class="btn btn-primary" data-action="save-settings">保存设置</button>
      </div>
    </div>
  </div>
</div>
<div id="btAlert" style="display:none;position:absolute;right:26px;bottom:78px;max-width:400px;z-index:100;
  background:var(--surface-2,#252a36);color:var(--text,#fff);border:1px solid var(--border,#3a4150);
  border-radius:10px;padding:13px 15px;box-shadow:0 8px 28px rgba(0,0,0,.35);font-size:12px;line-height:1.6">
  <div id="btAlertMsg"></div>
  <div style="margin-top:9px;display:flex;gap:8px">
    <button class="btn btn-primary btn-sm" data-action="bt-open-settings">打开蓝牙设置</button>
    <button class="btn btn-sm" data-action="bt-dismiss">知道了</button>
  </div>
</div>
<script src="app.js?v=0.1.8"></script>
</body>
</html>
